{% set name = "xorg-libxfont2" %}
{% set version = "2.0.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/libXfont2-{{ version }}.tar.gz
  sha256: a53d621b6ceb1dcbd05a0b9bd7f13c34efa40401cd5c05af904035c567a30f18

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - automake
    - autoconf
    - libtool
    - make
    - xorg-util-macros
  host:
    - freetype 2.13.3
    - zlib {{ zlib }}
    - xorg-xorgproto 2024.1
    - xorg-xtrans 1.6.0
    - xorg-libfontenc 1.1.8
  run:
    - freetype
    - zlib
    - xorg-xorgproto
    - xorg-xtrans
    - xorg-libfontenc

test:
  requires:
    - pkg-config
  commands:
    - test -f $PREFIX/lib/libXfont2.dylib  # [osx]
    - test -f $PREFIX/lib/libXfont2.so     # [linux]
    - pkg-config --exists xfont2

about:
  home: https://gitlab.freedesktop.org/xorg/lib/libxfont
  summary: X font file parsing and rasterizing library used by the X server
  description: |
    libXfont2 provides the core of the legacy X11 font system, handling
    font file parsing and rendering for the X server and Xvfb.
  license: MIT
  license_family: MIT
  license_file: COPYING
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxfont
  doc_url: https://www.x.org/wiki/Documentation/

extra:
  recipe-maintainers:
    - elundby
    - ViridianMelody